name: roots-leaves
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roots
      POSTGRES_PASSWORD: roots
      POSTGRES_DB: roots
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roots"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - roots-db:/var/lib/postgresql/data
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 4s
      retries: 12
volumes:
  roots-db:
